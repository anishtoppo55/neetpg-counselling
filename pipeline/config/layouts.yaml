    - [p1_course, 212]
    - [p1_remarks, 300]
    - [cur_quota, 355]
    - [cur_institute, 418]
    - [cur_course, 549]
    - [cur_allotted_cat, 645]
    - [cur_candidate_cat, 690]
    - [cur_option, 745]
    - [cur_remarks, 775]

