# Column layouts of the MCC allotment result PDFs, measured from word x-coordinates (pdftotext -bbox).
# `columns`: [name, x where the column starts]. `anchor`: x-range of the rank column; a number there starts a record.
# Columns: sno, rank, cur_* = this round's allotment, p1_*/p2_* = seat in round 1/2 as reprinted in this PDF.

single_round:          # Round 1, stray and special stray rounds (2024, 2025) – A4 portrait
  anchor: [45, 90]
  columns:
    - [sno, 0]
    - [rank, 45]
    - [cur_quota, 90]
    - [cur_institute, 180]
    - [cur_course, 540]
    - [cur_allotted_cat, 655]
    - [cur_candidate_cat, 695]
    - [cur_remarks, 762]

