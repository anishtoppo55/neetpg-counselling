# Render Blueprint – free-tier demo of the NEET PG Counselling Platform.
#
# Creates three resources: a free Postgres, the predictor API and the dashboard.
# Deploy: push THIS directory as the repository root, then Render → New → Blueprint → pick the repo.
# (If counselling_platform is a subdirectory of your repo instead, prefix both rootDir values with it.)
# Full walk-through, including loading the data: docs/deploy-render.md
#
# Free-tier facts that shape this file (render.com/docs/free):
#   * a free Postgres has 1 GB storage and EXPIRES 30 DAYS after creation (14-day grace period)
#   * free services sleep after 15 minutes idle and take ~1 minute to wake
#   * a free service can make private-network calls but CANNOT receive them, so the API needs a public
#     URL; it is protected by the shared secret API_TOKEN instead (generated once, copied to the web service)
#
# For anything beyond testing, move both services to a paid plan and make the API a private service.

databases:
  - name: neetpg-db
    databaseName: neetpg
    user: neetpg
    plan: free
    postgresMajorVersion: "16"
    # MUST match the services' region. Each Render region has its own private network, so a service can only
    # resolve a database's internal hostname inside the same region. A mismatch shows up at runtime as
    # "error connecting in 'pool-1': [Errno -2] Name or service not known". Databases default to oregon.
    region: singapore
    ipAllowList:                       # needed to load the data from your machine; empty = Render-only
      - source: 0.0.0.0/0
        description: temporary – remove after the data is loaded

services:
  # ----------------------------------------------------------------- predictor API
  - type: web
    name: neetpg-api
    runtime: docker
    plan: free
    region: singapore                  # closest Render region to India; change if you prefer
    rootDir: ./api
    dockerfilePath: ./Dockerfile.prod
    healthCheckPath: /api/live         # liveness only: a database problem must not block the deploy
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neetpg-db
          property: connectionString   # internal URL: stays on Render's private network
      - key: API_TOKEN
        generateValue: true            # created once by Render; the web service copies it below
      - key: DOCS_PUBLIC
        value: "false"                 # /docs needs the token too; set "true" to browse it openly
      - key: CORS_ORIGINS
        value: ""                      # the dashboard calls this API from its server, not the browser
      - key: DB_POOL_MAX
        value: "3"                     # free Postgres allows few connections

  # ----------------------------------------------------------------- dashboard
  - type: web
    name: neetpg-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: ./web
    dockerfilePath: ./Dockerfile.prod
    healthCheckPath: /api/ping         # static route, no database needed
    autoDeployTrigger: commit
    envVars:
      # The API's PUBLIC base URL, e.g. https://neetpg-api-xxxx.onrender.com
      #
      # This has to be set by hand in the Render dashboard (sync: false keeps the blueprint from overwriting
      # it). A blueprint cannot supply it: `fromService` only exposes a service's INTERNAL hostname
      # (host / hostport), and a free service cannot receive private-network requests — so an internal
      # address here fails with "fetch failed" in the dashboard.
      # On a paid plan, make the API a private service and use `fromService … property: hostport` instead.
      - key: API_BASE_INTERNAL
        sync: false
      - key: API_TOKEN                 # same secret as the API
        fromService:
          name: neetpg-api
          type: web
          envVarKey: API_TOKEN
      - key: NODE_ENV
        value: production
